name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  done:
    name: done
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Configure git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-nextest

      - name: Run project checks
        run: cargo make done

  web:
    name: web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup web toolchain
        uses: ./.github/actions/setup-web-env
        with:
          install-playwright: "true"

      - name: Run web lint
        working-directory: web
        run: npm run lint

      - name: Run web type checks
        working-directory: web
        run: npm run check

      - name: Run web e2e tests
        working-directory: web
        run: npm run test:e2e

      - name: Build web wasm
        working-directory: web
        run: npm run build:wasm

      - name: Build web site
        working-directory: web
        env:
          VITE_BASE_PATH: ./
        run: npm run build -- --logLevel warn

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  tauri-build:
    name: tauri build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tauri build toolchain
        uses: ./.github/actions/setup-web-env
        with:
          install-tauri-linux-deps: "true"

      - name: Build Tauri app
        working-directory: web
        run: npm run tauri:build

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-bundles
          path: |
            web/src-tauri/target/release/bundle
            web/src-tauri/target/release/end-desktop
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: deploy web
    runs-on: ubuntu-latest
    needs:
      - done
      - web
      - tauri-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=end --branch=main
          gitHubToken: ${{ github.token }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
